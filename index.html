<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>શાળા ડિજિટલ રજીસ્ટ્રી - ચારી પ્રાથમિક શાળા</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --radius: 8px;
    }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Noto Sans Gujarati', sans-serif; }
    body { background-color: var(--bg); margin: 0; padding: 12px; color: var(--text); }

    .header-bar {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white; padding: 12px 18px; border-radius: var(--radius);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .header-title { font-size: 18px; font-weight: 700; }
    .btn-logout { background: #ef4444; border: none; color: white; padding: 5px 12px; border-radius: 4px; cursor: pointer; }

    .tab-bar { display: flex; gap: 6px; margin-top: 12px; border-bottom: 2px solid var(--border); overflow-x: auto; }
    .tab-item {
      padding: 9px 14px; border: none; background: transparent; font-size: 14px; font-weight: 600;
      color: #64748b; cursor: pointer; border-radius: 6px 6px 0 0; white-space: nowrap;
    }
    .tab-item.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #eff6ff; }

    .card { background: var(--surface); padding: 16px; border-radius: var(--radius); margin-top: 12px; border: 1px solid var(--border); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
    .field-box { display: flex; flex-direction: column; }
    .field-label { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }

    .btn { background: var(--primary); color: white; border: none; padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-success { background: #16a34a; }
    .btn-secondary { background: #64748b; }

    .table-container { overflow-x: auto; margin-top: 12px; max-height: 520px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th { background: #f1f5f9; padding: 8px 10px; border: 1px solid var(--border); position: sticky; top: 0; }
    td { padding: 6px 10px; border: 1px solid var(--border); }
    tr:hover { background-color: #f8fafc; }

    .login-wrapper { max-width: 380px; margin: 60px auto; background: white; padding: 26px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); z-index: 9999; justify-content: center; align-items: center; font-weight: bold; }
  </style>
</head>
<body>

  <div id="loader"><i class="fa-solid fa-spinner fa-spin fa-2x"></i>&nbsp; ડેટા લોડ થઈ રહ્યો છે...</div>

  <!-- લૉગિન પેનલ -->
  <div id="loginScreen" class="login-wrapper">
    <h2 style="margin: 0; color: #1e3a8a;">ચારી પ્રાથમિક શાળા</h2>
    <p style="color: #64748b; font-size: 13px; margin: 4px 0 16px 0;">શિક્ષક / એડમિન લોગિન</p>
    <div style="text-align: left; margin-bottom: 12px;">
      <label class="field-label">Gmail:</label>
      <input type="email" id="login_email" placeholder="example@gmail.com">
    </div>
    <div style="text-align: left; margin-bottom: 16px;">
      <label class="field-label">પાસવર્ડ:</label>
      <input type="password" id="login_pass" placeholder="Chari1234@">
    </div>
    <button class="btn" style="width: 100%;" onclick="handleLogin()">લોગિન કરો</button>
  </div>

  <!-- ડેશબોર્ડ -->
  <div id="dashboardScreen" style="display: none;">
    <div class="header-bar">
      <div class="header-title">🏫 ચારી પ્રાથમિક શાળા - ડિજિટલ રજીસ્ટ્રી</div>
      <div>
        <span>👤 <strong id="loggedUserName">-</strong> (<span id="loggedUserRole">-</span>)</span>
        <button class="btn-logout" onclick="logout()" style="margin-left: 10px;">Logout</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab-item active" onclick="showTab('studentsTab')">✏️ વિદ્યાર્થી પસંદ / સુધારો</button>
      <button class="tab-item" onclick="showTab('listTab')">📋 રજીસ્ટ્રી લિસ્ટ (<span id="totalStudentsCount">0</span>)</button>
      <button class="tab-item" onclick="showTab('logsTab')">🕒 શિક્ષક કામગીરી રેકોર્ડ</button>
    </div>

    <!-- ટેબ ૧: વિદ્યાર્થી સુધારો -->
    <div id="studentsTab" class="card tab-content">
      <div style="background:#e0f2fe; padding:12px; border-radius:6px; margin-bottom:12px;">
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:10px;">
          <div>
            <label class="field-label">૧. ધોરણ પસંદ કરો:</label>
            <select id="selectStd" onchange="onStandardChange()"><option value="">-- ધોરણ --</option></select>
          </div>
          <div>
            <label class="field-label">૨. વિદ્યાર્થીનું નામ પસંદ કરો:</label>
            <select id="selectStudent" onchange="onStudentSelectChange()" disabled><option value="">-- વિદ્યાર્થી --</option></select>
          </div>
        </div>
      </div>

      <h3 id="formTitle" style="color: var(--primary); margin: 0;">વિદ્યાર્થી માહિતી ફોર્મ</h3>
      <input type="hidden" id="editRowIndex">
      <div class="form-grid" id="dynamicFormContainer"></div>

      <div style="display: flex; gap: 10px; margin-top: 14px;">
        <button class="btn btn-success" id="btnUpdateStudent" onclick="submitStudentUpdate()" style="display:none;">વિગત સેવ કરો</button>
        <button class="btn" id="btnAddStudent" onclick="submitNewStudent()">+ નવો વિદ્યાર્થી ઉમેરો</button>
        <button class="btn btn-secondary" id="btnCancelEdit" onclick="cancelStudentEdit()" style="display:none;">રદ કરો</button>
      </div>
    </div>

    <!-- ટેબ ૨: રજીસ્ટ્રી લિસ્ટ -->
    <div id="listTab" class="card tab-content" style="display: none;">
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
        <select id="filterListStd" onchange="applyListFilter()" style="max-width:140px;"><option value="All">તમામ ધોરણ</option></select>
        <input type="text" id="searchListName" placeholder="નામથી શોધો..." onkeyup="applyListFilter()" style="max-width:200px;">
      </div>
      <div class="table-container">
        <table>
          <thead><tr id="tableHeaderRow"></tr></thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- ટેબ ૩: શિક્ષક કામગીરી રેકોર્ડ -->
    <div id="logsTab" class="card tab-content" style="display: none;">
      <h3 style="margin-top:0; color:var(--primary);">શિક્ષકો દ્વારા થયેલી કામગીરી (Audit Log)</h3>
      <div class="table-container">
        <table>
          <thead><tr><th>તારીખ/સમય</th><th>શિક્ષક</th><th>Gmail</th><th>પ્રકાર</th><th>વિગત</th></tr></thead>
          <tbody id="logsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxw2eYxdnI_S9QQU50yaBUWwBEq1vQgTxNBMml8M59JIPtFO5FK7hjzktzZcqa09SanKQ/exec";

    let currentUserEmail = "";
    let currentUserName = "";
    let currentUserRole = "";

    let globalHeaders = [];
    let allStudents = [];
    let allLogs = [];
    let stdColIdx = 1;   // "ધોરણ" કોલમ
    let nameColIdx = 4;  // "વિદ્યાર્થીનું નામ" કોલમ

    function showLoader(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }

    async function handleLogin() {
      const email = document.getElementById('login_email').value.trim();
      const pass = document.getElementById('login_pass').value.trim();

      if (!email || !pass) { alert("Gmail અને પાસવર્ડ દાખલ કરો."); return; }

      showLoader(true);
      try {
        // GET પદ્ધતિથી કોલ જેથી CORS એરર ન આવે
        const res = await fetch(`${SCRIPT_URL}?action=authenticateUser&email=${encodeURIComponent(email)}&password=${encodeURIComponent(pass)}`);
        const data = await res.json();
        showLoader(false);

        if (data && data.success) {
          currentUserEmail = data.email;
          currentUserName = data.name;
          currentUserRole = data.role;

          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('dashboardScreen').style.display = 'block';
          document.getElementById('loggedUserName').innerText = currentUserName;
          document.getElementById('loggedUserRole').innerText = currentUserRole;

          loadSheetData();
        } else {
          alert(data.error || "ખોટી વિગત!");
        }
      } catch (err) {
        showLoader(false);
        alert("સર્વર કનેક્શનમાં ભૂલ આવી: " + err.message);
      }
    }

    async function loadSheetData() {
      showLoader(true);
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getRegistryData&userEmail=${encodeURIComponent(currentUserEmail)}&userRole=${encodeURIComponent(currentUserRole)}`);
        const data = await res.json();
        showLoader(false);

        if (!data || !data.headers) return;

        globalHeaders = data.headers;
        allStudents = data.students || [];
        allLogs = data.logs || [];

        // કોલમ ઇન્ડેક્સ ઓળખવા
        stdColIdx = globalHeaders.findIndex(h => h.includes("ધોરણ"));
        nameColIdx = globalHeaders.findIndex(h => h.includes("વિદ્યાર્થીનું નામ") && !h.includes("English"));

        document.getElementById('totalStudentsCount').innerText = allStudents.length;

        buildForm();
        buildTableHeaders();
        populateStdDropdowns();
        renderStudents(allStudents);
        renderLogs();
      } catch (err) {
        showLoader(false);
        alert("ડેટા લોડ કરવામાં ભૂલ: " + err.message);
      }
    }

    function buildForm() {
      let html = "";
      globalHeaders.forEach((h, idx) => {
        if (h.includes("ફોટો") || h.includes("આધાર કાર્ડ (") || h.includes("પાસબુક") || h.includes("જાતિ અંગે")) return;
        html += `<div class="field-box"><label class="field-label">${h}</label><input type="text" id="col_input_${idx}" placeholder="${h}"></div>`;
      });
      document.getElementById('dynamicFormContainer').innerHTML = html;
    }

    function buildTableHeaders() {
      let tr = "<th>ક્રિયા</th>";
      globalHeaders.forEach(h => { tr += `<th>${h}</th>`; });
      document.getElementById('tableHeaderRow').innerHTML = tr;
    }

    function populateStdDropdowns() {
      let stdSet = new Set();
      allStudents.forEach(s => {
        let val = s.values[stdColIdx];
        if (val) stdSet.add(val.toString().trim());
      });

      let sSelect = document.getElementById('selectStd');
      let fSelect = document.getElementById('filterListStd');
      sSelect.innerHTML = '<option value="">-- ધોરણ પસંદ કરો --</option>';
      fSelect.innerHTML = '<option value="All">તમામ ધોરણ</option>';

      stdSet.forEach(val => {
        sSelect.innerHTML += `<option value="${val}">${val}</option>`;
        fSelect.innerHTML += `<option value="${val}">${val}</option>`;
      });
    }

    function onStandardChange() {
      const val = document.getElementById('selectStd').value;
      const stSelect = document.getElementById('selectStudent');
      stSelect.innerHTML = '<option value="">-- વિદ્યાર્થી પસંદ કરો --</option>';

      if (!val) { stSelect.disabled = true; return; }

      const filtered = allStudents.filter(s => s.values[stdColIdx] === val);
      filtered.forEach(s => {
        const sName = s.values[nameColIdx] || ("રોલ " + s.values[2]);
        stSelect.innerHTML += `<option value="${s.rowIndex}">${sName}</option>`;
      });
      stSelect.disabled = false;
    }

    function onStudentSelectChange() {
      const rIndex = document.getElementById('selectStudent').value;
      const student = allStudents.find(s => s.rowIndex == rIndex);
      if (student) startEdit(student);
    }

    function startEdit(item) {
      document.getElementById('editRowIndex').value = item.rowIndex;
      globalHeaders.forEach((h, idx) => {
        const el = document.getElementById('col_input_' + idx);
        if (el) el.value = item.values[idx] || "";
      });
      document.getElementById('formTitle').innerText = "વિદ્યાર્થી સુધારો: " + item.values[nameColIdx];
      document.getElementById('btnAddStudent').style.display = "none";
      document.getElementById('btnUpdateStudent').style.display = "inline-flex";
      document.getElementById('btnCancelEdit').style.display = "inline-flex";
      showTab('studentsTab');
    }

    function cancelStudentEdit() {
      document.getElementById('editRowIndex').value = "";
      globalHeaders.forEach((h, idx) => {
        const el = document.getElementById('col_input_' + idx);
        if (el) el.value = "";
      });
      document.getElementById('formTitle').innerText = "વિદ્યાર્થી માહિતી ફોર્મ";
      document.getElementById('btnAddStudent').style.display = "inline-flex";
      document.getElementById('btnUpdateStudent').style.display = "none";
      document.getElementById('btnCancelEdit').style.display = "none";
    }

    async function submitStudentUpdate() {
      const rowIndex = document.getElementById('editRowIndex').value;
      const rowValues = globalHeaders.map((_, idx) => {
        const el = document.getElementById('col_input_' + idx);
        return el ? el.value.trim() : "";
      });

      showLoader(true);
      await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "updateStudentRow",
          rowIndex: rowIndex,
          newValues: rowValues,
          userEmail: currentUserEmail,
          userName: currentUserName,
          userRole: currentUserRole
        })
      });
      showLoader(false);

      alert("માહિતી સફળતાપૂર્વક સુધારી લેવાઈ છે!");
      cancelStudentEdit();
      loadSheetData();
    }

    async function submitNewStudent() {
      const rowValues = globalHeaders.map((_, idx) => {
        const el = document.getElementById('col_input_' + idx);
        return el ? el.value.trim() : "";
      });

      showLoader(true);
      await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "addStudentRow",
          newValues: rowValues,
          userEmail: currentUserEmail,
          userName: currentUserName,
          userRole: currentUserRole
        })
      });
      showLoader(false);

      alert("નવો વિદ્યાર્થી ઉમેરાઈ ગયો!");
      cancelStudentEdit();
      loadSheetData();
    }

    function renderStudents(list) {
      let sBody = "";
      list.forEach(item => {
        let tr = `<td><button class="btn" style="padding:3px 8px; font-size:11px;" onclick='startEdit(${JSON.stringify(item)})'>✏️ સુધારો</button></td>`;
        item.values.forEach(val => { tr += `<td>${val}</td>`; });
        sBody += `<tr>${tr}</tr>`;
      });
      document.getElementById('studentTableBody').innerHTML = sBody;
    }

    function renderLogs() {
      let html = "";
      allLogs.forEach(l => {
        html += `<tr><td>${l.timestamp}</td><td><strong>${l.name}</strong></td><td>${l.email}</td><td>${l.type}</td><td>${l.details}</td></tr>`;
      });
      document.getElementById('logsTableBody').innerHTML = html || "<tr><td colspan='5'>કોઈ રેકોર્ડ નથી.</td></tr>";
    }

    function applyListFilter() {
      const std = document.getElementById('filterListStd').value;
      const term = document.getElementById('searchListName').value.toLowerCase();
      const filtered = allStudents.filter(s => {
        const mStd = (std === "All" || s.values[stdColIdx] === std);
        const mTerm = (!term || s.values.some(v => v.toLowerCase().includes(term)));
        return mStd && mTerm;
      });
      renderStudents(filtered);
    }

    function showTab(id) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      document.getElementById(id).style.display = 'block';
      event.currentTarget.classList.add('active');
    }

    function logout() { location.reload(); }
  </script>
</body>
</html>
