<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>શાળા ડિજિટલ રજીસ્ટ્રી & શિક્ષક પોર્ટલ</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --surface: #ffffff;
      --bg: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --radius: 10px;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Noto Sans Gujarati', sans-serif; }
    body { background-color: var(--bg); margin: 0; padding: 14px; color: var(--text); }

    .header-bar {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      padding: 14px 20px;
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .user-pill {
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-logout { background: #ef4444; border: none; color: white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

    .tab-bar { display: flex; gap: 6px; margin-top: 14px; border-bottom: 2px solid var(--border); overflow-x: auto; }
    .tab-item {
      padding: 10px 16px; border: none; background: transparent; font-size: 14px;
      font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 6px 6px 0 0;
      white-space: nowrap; display: flex; align-items: center; gap: 6px;
    }
    .tab-item.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #e0e7ff; }

    .card { background: var(--surface); padding: 20px; border-radius: var(--radius); margin-top: 14px; border: 1px solid var(--border); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .field-label { font-size: 12px; font-weight: 600; margin-bottom: 4px; display: block; color: #334155; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }

    .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--primary-hover); }
    .btn-success { background: #16a34a; }
    .btn-danger { background: #dc2626; }

    .table-container { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th { background: #f8fafc; padding: 10px; border: 1px solid var(--border); text-align: left; }
    td { padding: 8px 10px; border: 1px solid var(--border); }
    tr:hover { background-color: #f8fafc; }

    .login-wrapper { max-width: 400px; margin: 60px auto; background: white; padding: 28px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); z-index: 9999; justify-content: center; align-items: center; font-weight: bold; }
  </style>
</head>
<body>

  <div id="loader"><i class="fa-solid fa-spinner fa-spin fa-2x"></i>&nbsp; ડેટા લોડ થઈ રહ્યો છે...</div>

  <!-- ૧. લૉગિન પેનલ -->
  <div id="loginScreen" class="login-wrapper">
    <div style="font-size: 36px; margin-bottom: 8px;">🏫</div>
    <h2 style="margin: 0; color: #1e3a8a;">ચારી પ્રાથમિક શાળા</h2>
    <p style="color: var(--text-muted); font-size: 13px; margin: 6px 0 20px 0;">શિક્ષક / એડમિન લોગિન</p>
    
    <div style="text-align: left; margin-bottom: 12px;">
      <label class="field-label">Gmail એડ્રેસ:</label>
      <input type="email" id="login_email" placeholder="teacher@gmail.com">
    </div>

    <div style="text-align: left; margin-bottom: 16px;">
      <label class="field-label">પાસવર્ડ:</label>
      <input type="password" id="login_pass" placeholder="••••••••">
      <small style="color: var(--text-muted); font-size: 11px;">ડિફોલ્ટ: <strong>Chari1234@</strong></small>
    </div>

    <button class="btn" style="width: 100%; padding: 10px;" onclick="handleLogin()">
      <i class="fa-solid fa-lock"></i> સુરક્ષિત લોગિન
    </button>
  </div>

  <!-- ૨. મુખ્ય ડેશબોર્ડ -->
  <div id="dashboardScreen" style="display: none;">
    <div class="header-bar">
      <div class="header-title"><i class="fa-solid fa-school"></i> શાળા ડિજિટલ રજીસ્ટ્રી</div>
      <div class="user-pill">
        <span>👤 <strong id="loggedUserName">-</strong> (<span id="loggedUserRole">-</span>)</span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab-item active" onclick="showTab('studentsTab')"><i class="fa-solid fa-user-pen"></i> વિદ્યાર્થી ફોર્મ & સુધારો</button>
      <button class="tab-item" onclick="showTab('listTab')"><i class="fa-solid fa-table-list"></i> રજીસ્ટ્રી લિસ્ટ</button>
      <button class="tab-item" id="navApprovals" onclick="showTab('approvalsTab')" style="display:none;"><i class="fa-solid fa-bell"></i> બાકી મંજૂરીઓ</button>
      <button class="tab-item" id="navLogs" onclick="showTab('logsTab')"><i class="fa-solid fa-clock-rotate-left"></i> શિક્ષક કામગીરી રેકોર્ડ</button>
    </div>

    <!-- ટેબ ૧: વિદ્યાર્થી ફોર્મ & સુધારો -->
    <div id="studentsTab" class="card tab-content">
      <div style="background:#e0f2fe; padding:12px; border-radius:6px; margin-bottom:14px;">
        <strong style="color:#0284c7;">🎯 વિદ્યાર્થી પસંદ કરો:</strong>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-top:6px;">
          <div>
            <label class="field-label">ધોરણ:</label>
            <select id="selectStd" onchange="onStandardChange()"><option value="">-- ધોરણ --</option></select>
          </div>
          <div>
            <label class="field-label">વિદ્યાર્થી:</label>
            <select id="selectStudent" onchange="onStudentSelectChange()" disabled><option value="">-- વિદ્યાર્થી --</option></select>
          </div>
        </div>
      </div>

      <h3 id="formTitle" style="color: var(--primary); margin-top: 0;">વિદ્યાર્થી માહિતી ફોર્મ</h3>
      <input type="hidden" id="editRowIndex">
      <div class="form-grid" id="dynamicFormContainer"></div>

      <div style="display: flex; gap: 10px; margin-top: 14px;">
        <button class="btn btn-success" id="btnUpdateStudent" onclick="submitStudentUpdate()" style="display:none;">વિગત સેવ કરો</button>
        <button class="btn" id="btnAddStudent" onclick="submitNewStudent()">+ નવો વિદ્યાર્થી ઉમેરો</button>
        <button class="btn" id="btnCancelEdit" onclick="cancelStudentEdit()" style="display:none; background:#64748b;">રદ કરો</button>
      </div>
    </div>

    <!-- ટેબ ૨: રજીસ્ટ્રી લિસ્ટ -->
    <div id="listTab" class="card tab-content" style="display: none;">
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
        <select id="filterListStd" onchange="applyListFilter()" style="max-width:140px;"><option value="All">તમામ ધોરણ</option></select>
        <input type="text" id="searchListName" placeholder="નામથી શોધો..." onkeyup="applyListFilter()" style="max-width:200px;">
      </div>
      <div class="table-container">
        <table>
          <thead><tr id="tableHeaderRow"></tr></thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- ટેબ ૩: બાકી મંજૂરીઓ -->
    <div id="approvalsTab" class="card tab-content" style="display: none;">
      <h3 style="color: #dc2626; margin-top: 0;">શિક્ષકો દ્વારા મોકલેલ મંજૂરીઓ</h3>
      <div id="approvalsContainer"></div>
    </div>

    <!-- ટેબ ૪: શિક્ષક કામગીરી રેકોર્ડ -->
    <div id="logsTab" class="card tab-content" style="display: none;">
      <h3 style="margin-top: 0; color: var(--primary);">કામગીરીનો ઇતિહાસ (Audit Logs)</h3>
      <div class="table-container">
        <table>
          <thead><tr><th>તારીખ/સમય</th><th>શિક્ષક</th><th>Gmail</th><th>પ્રકાર</th><th>વિગત</th></tr></thead>
          <tbody id="logsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxw2eYxdnI_S9QQU50yaBUWwBEq1vQgTxNBMml8M59JIPtFO5FK7hjzktzZcqa09SanKQ/exec";

    let currentUserEmail = "";
    let currentUserName = "";
    let currentUserRole = "";

    let globalHeaders = [];
    let allStudents = [];
    let allLogs = [];
    let stdColIdx = -1;
    let nameColIdx = -1;

    function showLoader(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }

    async function callApi(action, payload = {}) {
      showLoader(true);
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: action, ...payload })
        });
        const data = await res.json();
        showLoader(false);
        return data;
      } catch (e) {
        showLoader(false);
        alert("કનેક્શન એરર: " + e.message);
        return null;
      }
    }

    async function handleLogin() {
      const email = document.getElementById('login_email').value.trim();
      const pass = document.getElementById('login_pass').value.trim();

      const res = await callApi("authenticateUser", { email: email, password: pass });
      if (res && res.success) {
        currentUserEmail = res.email;
        currentUserName = res.name;
        currentUserRole = res.role;

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboardScreen').style.display = 'block';
        document.getElementById('loggedUserName').innerText = currentUserName;
        document.getElementById('loggedUserRole').innerText = currentUserRole;

        if (currentUserRole === "Admin") {
          document.getElementById('navApprovals').style.display = 'inline-flex';
          document.getElementById('btnUpdateStudent').innerText = "સીધું સેવ કરો (Admin)";
        } else {
          document.getElementById('btnUpdateStudent').innerText = "મંજૂરી માટે મોકલો";
        }
        loadData();
      } else {
        alert(res ? res.error : "લોગિન નિષ્ફળ!");
      }
    }

    async function loadData() {
      const data = await callApi("getRegistryData", { userEmail: currentUserEmail, userRole: currentUserRole });
      if (!data) return;

      globalHeaders = data.headers;
      allStudents = data.students;
      allLogs = data.logs;

      stdColIdx = globalHeaders.findIndex(h => h.includes("ધોરણ"));
      nameColIdx = globalHeaders.findIndex(h => h.includes("નામ"));

      buildForm();
      buildTableHeaders();
      populateStdDropdowns();
      renderStudents(allStudents);
      renderLogs();
      if (currentUserRole === "Admin") renderApprovals(data.approvals);
    }

    function buildForm() {
      let html = "";
      globalHeaders.forEach((h, idx) => {
        if (h.includes("ફોટો") || h.includes("આધાર કાર્ડ (") || h.includes("પાસબુક")) return;
        html += `<div class="field-box"><label class="field-label">${h}</label><input type="text" id="col_input_${idx}" placeholder="${h}"></div>`;
      });
      document.getElementById('dynamicFormContainer').innerHTML = html;
    }

    function buildTableHeaders() {
      let tr = "<th>ક્રિયા</th>";
      globalHeaders.forEach(h => { tr += `<th>${h}</th>`; });
      document.getElementById('tableHeaderRow').innerHTML = tr;
    }

    function populateStdDropdowns() {
      let stdSet = new Set();
      allStudents.forEach(s => { if (s.values[stdColIdx]) stdSet.add(s.values[stdColIdx]); });
      let sSelect = document.getElementById('selectStd');
      let fSelect = document.getElementById('filterListStd');
      sSelect.innerHTML = '<option value="">-- ધોરણ --</option>';
      fSelect.innerHTML = '<option value="All">તમામ ધોરણ</option>';
      stdSet.forEach(val => {
        sSelect.innerHTML += `<option value="${val}">${val}</option>`;
        fSelect.innerHTML += `<option value="${val}">${val}</option>`;
      });
    }

    function onStandardChange() {
      const val = document.getElementById('selectStd').value;
      const stSelect = document.getElementById('selectStudent');
      stSelect.innerHTML = '<option value="">-- વિદ્યાર્થી --</option>';
      if (!val) { stSelect.disabled = true; return; }

      const filtered = allStudents.filter(s => s.values[stdColIdx] === val);
      filtered.forEach(s => {
        stSelect.innerHTML += `<option value="${s.rowIndex}">${s.values[nameColIdx]}</option>`;
      });
      stSelect.disabled = false;
    }

    function onStudentSelectChange() {
      const rIndex = document.getElementById('selectStudent').value;
      const student = allStudents.find(s => s.rowIndex == rIndex);
      if (student) startEdit(student);
    }

    function startEdit(item) {
      document.getElementById('editRowIndex').value = item.rowIndex;
      globalHeaders.forEach((h, idx) => {
        const el = document.getElementById('col_input_' + idx);
        if (el) el.value = item.values[idx] || "";
      });
      document.getElementById('formTitle').innerText = "વિદ્યાર્થી સુધારો: " + item.values[nameColIdx];
      document.getElementById('btnAddStudent').style.display = "none";
      document.getElementById('btnUpdateStudent').style.display = "inline-flex";
      document.getElementById('btnCancelEdit').style.display = "inline-flex";
      showTab('studentsTab');
    }

    function cancelStudentEdit() {
      document.getElementById('editRowIndex').value = "";
      globalHeaders.forEach((h, idx) => {
        const el = document.getElementById('col_input_' + idx);
        if (el) el.value = "";
      });
      document.getElementById('formTitle').innerText = "વિદ્યાર્થી માહિતી ફોર્મ";
      document.getElementById('btnAddStudent').style.display = "inline-flex";
      document.getElementById('btnUpdateStudent').style.display = "none";
      document.getElementById('btnCancelEdit').style.display = "none";
    }

    async function submitStudentUpdate() {
      const rowIndex = document.getElementById('editRowIndex').value;
      const rowValues = globalHeaders.map((_, idx) => {
        const el = document.getElementById('col_input_' + idx);
        return el ? el.value.trim() : "";
      });

      const res = await callApi("updateStudentRow", {
        rowIndex: rowIndex,
        newValues: rowValues,
        userEmail: currentUserEmail,
        userName: currentUserName,
        userRole: currentUserRole
      });

      alert(res.message);
      cancelStudentEdit();
      loadData();
    }

    async function submitNewStudent() {
      const rowValues = globalHeaders.map((_, idx) => {
        const el = document.getElementById('col_input_' + idx);
        return el ? el.value.trim() : "";
      });

      const res = await callApi("addStudentRow", {
        newValues: rowValues,
        userEmail: currentUserEmail,
        userName: currentUserName,
        userRole: currentUserRole
      });

      alert(res.message);
      cancelStudentEdit();
      loadData();
    }

    function renderStudents(list) {
      let sBody = "";
      list.forEach(item => {
        let tr = `<td><button class="btn" style="padding:3px 8px; font-size:11px;" onclick='startEdit(${JSON.stringify(item)})'>✏️ સુધારો</button></td>`;
        item.values.forEach(val => { tr += `<td>${val}</td>`; });
        sBody += `<tr>${tr}</tr>`;
      });
      document.getElementById('studentTableBody').innerHTML = sBody;
    }

    function renderLogs() {
      let html = "";
      allLogs.forEach(l => {
        html += `<tr><td>${l.timestamp}</td><td><strong>${l.name}</strong></td><td>${l.email}</td><td>${l.type}</td><td>${l.details}</td></tr>`;
      });
      document.getElementById('logsTableBody').innerHTML = html || "<tr><td colspan='5'>કોઈ રેકોર્ડ નથી.</td></tr>";
    }

    function renderApprovals(approvals) {
      let c = document.getElementById('approvalsContainer');
      if (!approvals || approvals.length === 0) { c.innerHTML = "<p>કોઈ મંજૂરી બાકી નથી.</p>"; return; }
      let html = "";
      approvals.forEach(a => {
        html += `<div style="border:1px solid #ccc; padding:10px; margin-bottom:8px; border-radius:6px;">
          <span><strong>શિક્ષક:</strong> ${a.requestedBy} (${a.requestTime})</span>
          <div style="margin-top:6px;">
            <button class="btn btn-success" onclick="actionApprove(${a.id})">✓ મંજૂર</button>
            <button class="btn btn-danger" onclick="actionReject(${a.id})">✕ નામંજૂર</button>
          </div>
        </div>`;
      });
      c.innerHTML = html;
    }

    async function actionApprove(id) {
      const res = await callApi("approveRequest", { id: id, userEmail: currentUserEmail, userName: currentUserName });
      alert(res.message);
      loadData();
    }

    async function actionReject(id) {
      const res = await callApi("rejectRequest", { id: id, userEmail: currentUserEmail, userName: currentUserName });
      alert(res.message);
      loadData();
    }

    function applyListFilter() {
      const std = document.getElementById('filterListStd').value;
      const term = document.getElementById('searchListName').value.toLowerCase();
      const filtered = allStudents.filter(s => {
        const mStd = (std === "All" || s.values[stdColIdx] === std);
        const mTerm = (!term || s.values.some(v => v.toLowerCase().includes(term)));
        return mStd && mTerm;
      });
      renderStudents(filtered);
    }

    function showTab(id) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      document.getElementById(id).style.display = 'block';
      event.currentTarget.classList.add('active');
    }

    function logout() { location.reload(); }
  </script>
</body>
</html>
